name: autowp
services:
  createbuckets:
    image: amazon/aws-cli:2.37.4
    container_name: autowp_test_createbuckets
    depends_on:
      - minio
    volumes:
      - ./goautowp/test/createbuckets.sh:/createbuckets.sh:ro
    environment:
      AWS_ENDPOINT_URL: "http://minio:9000"
      AWS_ACCESS_KEY_ID: "AKIAIOSFODNN7EXAMPLE"
      AWS_SECRET_ACCESS_KEY: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
      AWS_DEFAULT_REGION: "us-east-1"
    entrypoint: ["/createbuckets.sh", format, user, brand, picture, files]

  frontend:
    image: registry.pereslegin.ru/autowp/autowp/frontend:v8.53.1
    container_name: autowp_test_frontend
    depends_on:
      - goautowp-serve
    volumes:
      - ./frontend/dist:/app
    network_mode: "service:goautowp-serve"
    restart: always
    user: "101:101"
    read_only: true

  goautowp-scheduler-generate-index-cache:
    image: registry.pereslegin.ru/autowp/autowp/goautowp:v8.53.1
    container_name: autowp_test_goautowp_scheduler_generate_index_cache
    depends_on:
      - keycloak
      - postgres
      - rabbitmq
      - redis
    volumes:
      - ./goautowp-config.yaml:/config.yaml:ro
    command: scheduler-generate-index-cache --loglevel=debug

  goautowp-serve:
    image: registry.pereslegin.ru/autowp/autowp/goautowp:v8.53.1
    container_name: autowp_test_goautowp_serve
    depends_on:
      - keycloak
      - postgres
      - rabbitmq
      - redis
    volumes:
      - ./goautowp-config.yaml:/config.yaml:ro
    ports:
      - '0.0.0.0:2112:2112'
      - '0.0.0.0:2113:8080'
    command: serve --df-amqp --monitoring-amqp --grpc --public --autoban --attrs-update-values-amqp --loglevel=debug
    restart: always
    user: "0"

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: autowp_test_keycloak
    depends_on:
      - postgres
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/realm.json
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: password
    ports:
      - '0.0.0.0:8081:8080'
    command:
      - "start"
      - "--import-realm"
      - "--hostname=localhost"
      - "--http-enabled=true"
      - "--db=postgres"
      - "--db-url=jdbc:postgresql://postgres:5432/keycloak"
      - "--db-username=keycloak"
      - "--db-password=password"
    restart: always

  minio:
    # RustFS (S3-compatible, Apache-2.0) under the historical "minio" service name/hostname that the
    # goautowp configs point to: MinIO images are no longer anonymously pullable.
    image: rustfs/rustfs:1.0.0
    container_name: autowp_test_minio
    volumes:
      - s3-data:/data
    environment:
      RUSTFS_ACCESS_KEY: "AKIAIOSFODNN7EXAMPLE"
      RUSTFS_SECRET_KEY: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - '0.0.0.0:9000:9000'
      - '0.0.0.0:9001:9001'
    restart: always

  postgres:
    image: postgis/postgis:18-3.6-alpine
    container_name: autowp_test_traffic_postgres
    volumes:
      - ./goautowp/test/postgres-initdb.d/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
      - ./goautowp/test/postgres-initdb.d/create-keycloak-database.sh:/docker-entrypoint-initdb.d/create-keycloak-database.sh:ro
    environment:
      - POSTGRES_DB=traffic
      - POSTGRES_USER=traffic
      - POSTGRES_PASSWORD=password
      - KECYLOAK_DB_NAME=keycloak
      - KECYLOAK_DB_USER=keycloak
      - KECYLOAK_DB_PASSWORD=password
    ports:
      - '0.0.0.0:5432:5432'
    restart: always
    expose:
      - '5432'

  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: autowp_test_rabbitmq
    ports:
      - '0.0.0.0:4369:4369'
      - '0.0.0.0:5671:5671'
      - '0.0.0.0:5672:5672'
      - '0.0.0.0:15671:15671'
      - '0.0.0.0:15672:15672'
      - '0.0.0.0:15691:15691'
      - '0.0.0.0:15692:15692'
      - '0.0.0.0:25672:25672'

  redis:
    image: redis:alpine
    container_name: autowp_test_redis
    restart: always
    expose:
      - '6379'
  router:
    image: nginx:1-alpine
    container_name: autowp_test_router
    depends_on:
      - frontend
      - goautowp-serve
      - keycloak
    volumes:
      - ./router.conf:/etc/nginx/nginx.conf:ro
      - ./localhost.crt:/localhost.crt
      - ./localhost.key:/localhost.key
    ports:
      - '0.0.0.0:80:80'
      - '0.0.0.0:443:443'
    restart: always

volumes:
  s3-data:
