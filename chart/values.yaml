      cpu: 1000m
      memory: 5Gi
    requests:
      cpu: 100m
      memory: 100Mi
  commonAnnotations:
    ignore-check.kube-linter.io/no-read-only-root-fs: "The variable RABBITMQ_COMBINED_CERT_PATH must be set to either an existant file or a non-existant file in a writable directory."
    ignore-check.kube-linter.io/pdb-unhealthy-pod-eviction-policy: "pdb-unhealthy-pod-eviction-policy"
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
  volumePermissions:
    image:
      repository: bitnamilegacy/os-shell
## The locales the site is served in, and the host each one answers on. One list feeds both
## the goautowp config (code -> hostname/aliases) and the SSR sidecar's nginx, which needs to
## know which directory of the frontend build a host is served from - `locale` is that
## directory name, i.e. a key of i18n.locales in frontend/angular.json (plus its sourceLocale).
languages:
  - code: en
    locale: en-GB
    hostname: en.wheelsage.org
    aliases:
      - wheelsage.org
      - www.wheelsage.org
  - code: zh
    locale: zh-CN
    hostname: zh.wheelsage.org
  - code: ru
    locale: ru
    hostname: www.autowp.ru
  - code: pt-br
    locale: pt-BR
    hostname: br.wheelsage.org
  - code: fr
    locale: fr
    hostname: fr.wheelsage.org
  - code: be
    locale: be
    hostname: be.wheelsage.org
  - code: uk
    locale: uk
    hostname: uk.wheelsage.org
  - code: es
    locale: es-ES
    hostname: es.wheelsage.org
  - code: it
    locale: it
    hostname: it.wheelsage.org
  - code: he
    locale: he
    hostname: he.wheelsage.org
  - code: de
    locale: de
    hostname: de.wheelsage.org
  - code: ja
    locale: ja
    hostname: ja.wheelsage.org
