frontend:
  image:
    registry: registry.pereslegin.ru
    repository: autowp/autowp/frontend
    tag: v1.245.3
    digest: ""
    pullPolicy: IfNotPresent
    pullSecrets: []
  ## nginx sidecar that serves the built bundle off disk and proxies only page requests to the SSR
  ## process - see templates/goautowp/frontend-assets-cm.yaml. Port 8081 because the pod's network
  ## namespace is shared: 8080/8082/2112 belong to goautowp and 4000 to the SSR server.
  assets:
    port: 8081
    ## Cache of server-rendered pages held by that nginx, shared by every SSR worker in the pod
    ## (the process' own cache in frontend/src/ssr-cache.ts is per worker, so cluster round-robin
    ## splits its hit rate). ttl is short on purpose - a served page carries its data inline in the
    ## transfer cache, so a visitor sees whatever the render captured - but expiry is never paid
    ## for by a visitor: stale entries are served while one background request refreshes them.
    cache:
      ttl: 60s
      notFoundTtl: 30s
      ## Shared-memory zone for the keys (~8000 keys per megabyte) and the on-disk body budget.
      keysZone: 10m
      maxSize: 512m
      ## Entries untouched for this long are dropped regardless of ttl.
      inactive: 10m
    image:
      registry: docker.io
      repository: nginxinc/nginx-unprivileged
      tag: 1-alpine
      digest: ""
      pullPolicy: IfNotPresent
      pullSecrets: []
  ## Admission control in front of the renderer (frontend/src/render-queue.ts), per worker - so a
  ## pod allows workers x maxConcurrent renders at once. Bounding this is what keeps a crawl from
  ## turning into hundreds of simultaneous renders, thousands of concurrent backend calls, and a
  ## queue inside Postgres, which is how renders ended up taking 20-40s. Requests that can't get a
  ## slot within queueTimeoutMs are answered with the client-side rendering shell instead: no SEO
  ## content on that response, but the visitor gets the page and the pod stays alive.
  render:
    maxConcurrent: 2
    maxQueued: 8
    queueTimeoutMs: 5000
  ## Heap cap per worker, in MB. Without it V8 sizes the heap from the *node's* memory (~4GB on any
  ## real machine) and ignores the container limit, so four workers can each grow past what the pod
  ## is allowed before GC gets serious - and the container is killed mid-render instead. Keep
  ## workers x (this + ~200MB of bundles and overhead) comfortably under the memory limit below.
  maxOldSpaceSizeMb: 768
  ## Render processes per pod. Rendering is single-threaded, so one process uses exactly one core
  ## however many the container is allowed - production sat at ~1 CPU per pod against a 4 CPU
  ## limit until this existed. Keep it at or below the CPU limit below; unlike adding replicas, it
  ## costs no extra postgres connections, since those belong to the goautowp container.
  workers: 4
  ## In-memory cache of server-rendered pages, per SSR pod (see src/ssr-cache.ts). Rendering one
  ## page costs 10-30 gRPC calls, so this is mostly here to collapse concurrent requests for the
  ## same URL into a single render - that part works even with ttlMs: 0, which disables reuse.
  ## Reuse itself is short by design: a served page carries its data in the transfer cache, so the
  ## visitor sees whatever the render captured until they navigate.
  ## maxBytes is a quoted string on purpose: helm parses YAML numbers as float64, and an unquoted
  ## 67108864 renders into the pod spec as "6.7108864e+07".
  ssrCache:
    ttlMs: 10000
    maxBytes: "67108864"
