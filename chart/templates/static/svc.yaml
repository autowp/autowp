apiVersion: v1
kind: Service
metadata:
  labels: {{- include "cloudpirates.labels" . | nindent 4 }}
  name: {{ include "autowp.static.fullname" . | quote }}
spec:
  ports:
    - name: app-port
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector: {{ include "cloudpirates.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: static
  sessionAffinity: None
  type: ClusterIP
