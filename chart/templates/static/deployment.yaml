kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ include "autowp.static.fullname" . | quote }}
data:
  nginx.conf: |-
    user  nginx;
    worker_processes  auto;

    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    error_log /dev/stderr warn;
    pid       /tmp/nginx.pid;

    events {
      worker_connections  1024;
    }

    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;

      access_log /dev/stdout;
      server_tokens off;

      sendfile        on;
      #tcp_nopush     on;

      keepalive_timeout  65;

      #gzip  on;

      include /etc/nginx/conf.d/*.conf;
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autowp.static.fullname" . | quote }}
  annotations:
    ignore-check.kube-linter.io/no-read-only-root-fs: "nginx required temporary files for buffering"
spec:
  selector:
    matchLabels: {{ include "common.labels.matchLabels" . | nindent 6 }}
      app.kubernetes.io/component: static
  replicas: 1
  template:
    metadata:
      labels: {{- include "common.labels.standard" . | nindent 8 }}
        app.kubernetes.io/component: static
    spec:
      {{- include "autowp.imagePullSecrets" . | nindent 6 }}
      # Nothing in these containers talks to the Kubernetes API, so the token is only an
      # unnecessary credential sitting in the filesystem.
      automountServiceAccountToken: false
      volumes:
        - name: img
          persistentVolumeClaim:
            claimName: img
        - name: config
          configMap:
            name: {{ include "autowp.static.fullname" . | quote }}
      containers:
        - name: static
          image: {{ include "autowp.static.image" . }}
          imagePullPolicy: {{ .Values.static.image.pullPolicy | quote }}
          ports:
            - name: app-port
              containerPort: 8080
          env:
            - name: NGINX_ENTRYPOINT_QUIET_LOGS
              value: "1"
          startupProbe:
            httpGet:
              path: /
              port: app-port
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: app-port
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: app-port
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - mountPath: "/usr/share/nginx/html/img"
              name: "img"
              readOnly: true
            - mountPath: "/etc/nginx/nginx.conf"
              name: "config"
              subPath: "nginx.conf"
              readOnly: true
          resources:
            limits:
              memory: 5Gi
              cpu: 4000m
            requests:
              memory: 10M
              cpu: 50m
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
      securityContext:
        runAsNonRoot: true
        fsGroup: 101
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                topologyKey: "kubernetes.io/hostname"
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - static
              weight: 100
