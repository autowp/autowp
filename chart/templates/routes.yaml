              port:
                name: app-port
        - path: "/goautowp.Messaging/"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        - path: "/goautowp.Pictures/"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        - path: "/goautowp.Donations/"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        - path: "/goautowp.Forums/"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        - path: "/goautowp.Attrs/"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        - path: "/goautowp.Rating/"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
