{{- range .Values.redirects }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redirect-{{ .to }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/permanent-redirect: $scheme://{{ .to }}$request_uri
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        {{- range .from }}
        - {{ . }}
        {{- end }}
      secretName: tls-redirect-{{ .to }}
  rules:
    {{- range .from }}
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
                port:
                  name: frontend-port
    {{- end }}
{{- end }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        {{- range .Values.hostnames }}
        - {{ . }}
        {{- end }}
      secretName: tls
  rules:
  {{- range .Values.hostnames }}
  - host: {{ . }}
    http:
      paths:
        - path: /img/
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.static.fullname" $ | quote }}
              port:
                name: app-port
        - path: /api/
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        # Every grpc-web service path (/goautowp.Autowp/, /goautowp.Traffic/, ...) used to get its own
        # near-identical rule here - all ~23 of them route to this same service/port, differing only in
        # a substring within one path segment, which plain pathType: Prefix can't collapse (it matches
        # whole path elements, not substrings). Collapsed into one regex rule in the backend-grpc-web
        # Ingress below instead, kept as a separate resource since nginx.ingress.kubernetes.io/use-regex
        # applies to every path in the Ingress it's set on, and the literal paths here shouldn't become
        # regexes too.
        - path: "/ws/"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        - path: "/yoomoney/informing"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        - path: "/telegram/webhook/token/"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        # Pages go to the nginx sidecar, not straight to the SSR server: it answers for the built
        # bundle off disk and passes only what isn't a file through to Node. The backend paths
        # above keep going directly to goautowp - routing them through the sidecar would make the
        # peer loopback, which is outside trusted-network, and realip would drop the client's
        # X-Forwarded-For.
        - path: /
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: assets-port
  {{- end }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-grpc-web
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    # No cert-manager.io/cluster-issuer here - this Ingress covers the exact same hosts as backend
    # above, which already provisions secretName tls for them; adding the annotation to both would make
    # cert-manager issue and manage a second, redundant Certificate for the same hosts into the same
    # Secret. nginx-ingress itself is fine reading a tls secretName that a different Ingress for the
    # same host provisions.
    #
    # Scoped to this Ingress object only - the backend Ingress above keeps its literal paths as plain
    # pathType: Prefix rules, since this annotation would turn every path in whichever Ingress it's set
    # on into a regex.
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        {{- range .Values.hostnames }}
        - {{ . }}
        {{- end }}
      secretName: tls
  rules:
  {{- range .Values.hostnames }}
  - host: {{ . }}
    http:
      paths:
        # Matches every grpc-web service path (/goautowp.Autowp/, /goautowp.Traffic/, ...) in one rule -
        # see the backend Ingress's own comment for why this couldn't just be a pathType: Prefix rule.
        - path: "/goautowp\\.[^/]+/"
          pathType: ImplementationSpecific
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
  {{- end }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grpc
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ .Values.grpcHostname | quote }}
      secretName: grpc-tls
  rules:
  - host: {{ .Values.grpcHostname | quote }}
    http:
      paths:
        - path: "/"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: grpc-port
