{{- range .Values.redirects }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redirect-{{ .to }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/permanent-redirect: $scheme://{{ .to }}$request_uri
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        {{- range .from }}
        - {{ . }}
        {{- end }}
      secretName: tls-redirect-{{ .to }}
  rules:
    {{- range .from }}
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
                port:
                  name: frontend-port
    {{- end }}
{{- end }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        {{- range .Values.hostnames }}
        - {{ . }}
        {{- end }}
      secretName: tls
  rules:
  {{- range .Values.hostnames }}
  - host: {{ . }}
    http:
      paths:
        - path: /img/
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.static.fullname" $ | quote }}
              port:
                name: app-port
        - path: /api/
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        - path: "/goautowp.Users/"
