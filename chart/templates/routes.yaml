{{- range .Values.redirects }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redirect-{{ .to }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/permanent-redirect: $scheme://{{ .to }}$request_uri
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        {{- range .from }}
        - {{ . }}
        {{- end }}
      secretName: tls-redirect-{{ .to }}
  rules:
    {{- range .from }}
    - host: {{ . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
                port:
                  name: frontend-port
    {{- end }}
{{- end }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        {{- range .Values.hostnames }}
        - {{ . }}
        {{- end }}
      secretName: tls
  rules:
  {{- range .Values.hostnames }}
  - host: {{ . }}
    http:
      paths:
        - path: /img/
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.static.fullname" $ | quote }}
              port:
                name: app-port
        - path: /api/
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        - path: "/goautowp.Autowp/"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        - path: "/goautowp.Traffic/"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        - path: "/goautowp.Contacts/"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        - path: "/goautowp.Users/"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        - path: "/goautowp.Items/"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        - path: "/goautowp.Comments/"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        - path: "/goautowp.Map/"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        - path: "/goautowp.Messaging/"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        - path: "/goautowp.Statistics/"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        - path: "/goautowp.Pictures/"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        - path: "/goautowp.Donations/"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        - path: "/goautowp.Articles/"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        - path: "/goautowp.Forums/"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        - path: "/goautowp.Text/"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        - path: "/goautowp.Attrs/"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        - path: "/goautowp.Rating/"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        - path: "/goautowp.Log/"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        - path: "/goautowp.Mosts/"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        - path: "/goautowp.Votings/"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        - path: "/goautowp.Achievements/"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        - path: "/ws/"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        - path: "/yoomoney/informing"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        - path: "/telegram/webhook/token/"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: app-port
        # Pages go to the nginx sidecar, not straight to the SSR server: it answers for the built
        # bundle off disk and passes only what isn't a file through to Node. The backend paths
        # above keep going directly to goautowp - routing them through the sidecar would make the
        # peer loopback, which is outside trusted-network, and realip would drop the client's
        # X-Forwarded-For.
        - path: /
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: assets-port
  {{- end }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grpc
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ .Values.grpcHostname | quote }}
      secretName: grpc-tls
  rules:
  - host: {{ .Values.grpcHostname | quote }}
    http:
      paths:
        - path: "/"
          pathType: Prefix
          backend:
            service:
              name: {{ include "autowp.goautowp.serve.fullname" $ | quote }}
              port:
                name: grpc-port
