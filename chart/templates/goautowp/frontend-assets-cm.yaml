{{/*
nginx that fronts the SSR container: it answers for the built frontend bundle off disk, caches
rendered pages, and hands only the page requests it can't answer itself to Node. Serving those
files from the Node process itself put them in the same single-threaded queue as server-side
rendering, where they waited tens of seconds behind renders.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  labels: {{- include "common.labels.standard" . | nindent 4 }}
  name: {{ printf "%s-frontend-assets" (include "autowp.goautowp.serve.fullname" .) | quote }}
data:
  nginx.conf: |
    worker_processes auto;
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;

    events {
      worker_connections 4096;
    }

    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;

      access_log off;
      sendfile on;
      tcp_nopush on;
      server_tokens off;

      # Everything nginx writes goes to the tmp volume: the container's root filesystem is
      # read-only.
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;

      # Caches the existence check too (open_file_cache_errors), so page requests - which never
      # match a file - stop paying for a stat on every hit.
      open_file_cache max=10000 inactive=60s;
      open_file_cache_valid 60s;
      open_file_cache_min_uses 2;
      open_file_cache_errors on;

      # Rendered pages, shared by the whole pod. The SSR process has its own in-memory cache
      # (frontend/src/ssr-cache.ts), but that one is per worker, so the cluster's round-robin
      # splits its hit rate across every worker; this one sits in front of all of them and, unlike
      # that cache, costs no heap in the process that has to do the rendering. Under /tmp because
      # the container's root filesystem is read-only.
      proxy_cache_path /tmp/ssr-cache levels=1:2 keys_zone=ssr:{{ .Values.frontend.assets.cache.keysZone }}
                       max_size={{ .Values.frontend.assets.cache.maxSize }} inactive={{ .Values.frontend.assets.cache.inactive }} use_temp_path=off;

      gzip on;
      gzip_vary on;
      gzip_types text/css text/plain application/javascript application/json application/xml image/svg+xml;

      # Each locale is built into its own directory (i18n.locales in frontend/angular.json), and the
      # host decides which one - the same mapping the SSR server applies with vhost.
      map $host $frontend_root {
        default /srv/browser/{{ (first .Values.languages).locale }};
        {{ range $language := .Values.languages }}
        {{ $language.hostname }} /srv/browser/{{ $language.locale }};
        {{ range $language.aliases }}
        {{ . }} /srv/browser/{{ $language.locale }};
        {{ end }}
        {{ end }}
      }

      server {
        listen {{ .Values.frontend.assets.port }};
        root $frontend_root;

        # A missing asset is a 404, not a reason to render a page. Without this, a mistyped or
        # relatively-resolved asset URL (/mosts/.../favicons/icon.png, say) reaches the router,
        # matches a route, and costs a full server-side render to answer with HTML.
        location ~* ^/(assets|favicons)/ {
          try_files $uri =404;
          expires 1y;
          add_header Cache-Control "public, immutable";
        }

        location ~* \.(js|mjs|css|map|ico|png|jpe?g|gif|svg|webp|avif|woff2?|ttf|eot|xml|txt|webmanifest)$ {
          try_files $uri =404;
          expires 1y;
          add_header Cache-Control "public, immutable";
        }

        location / {
          try_files $uri @ssr;
        }

        location @ssr {
          proxy_pass http://127.0.0.1:4000;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          # A render nobody is waiting for any more is worse than no render: it holds a slot in the
          # SSR process and an nginx worker for as long as it runs. Anything past this is given up
          # on, and the shell below is served instead.
          proxy_read_timeout 30s;

          # When the SSR process can't answer at all - overloaded, restarting, gone - the visitor
          # gets the client-side rendering shell rather than nginx's 502 page. It is the same
          # bundle this nginx already serves off disk, so it costs a file read and works while the
          # pod recovers. Only nginx's own failures land here; statuses the app itself returns
          # (404s and the like) pass through untouched, since proxy_intercept_errors stays off.
          error_page 502 504 = @csr_shell;

          proxy_cache ssr;
          # Host is part of the key because one nginx serves every locale, and the same path
          # renders differently per host. Deliberately not varying on Cookie: a server-side render
          # is anonymous by construction (Keycloak never initializes on the server), so two
          # visitors requesting the same URL get byte-identical HTML - see the same reasoning in
          # frontend/src/ssr-cache.ts. Responses that do carry a Set-Cookie are left uncached by
          # nginx's own default, which is why that default is not overridden here.
          proxy_cache_key "$host$request_uri";
          proxy_cache_valid 200 301 302 {{ .Values.frontend.assets.cache.ttl }};
          # Crawlers walking dead URLs shouldn't each cost a render of the 404 page.
          proxy_cache_valid 404 {{ .Values.frontend.assets.cache.notFoundTtl }};
          # A burst of requests for one uncached URL waits on a single render instead of starting
          # one each - the thing that actually protects a 4-worker pod from a crawler.
          proxy_cache_lock on;
          proxy_cache_lock_age 30s;
          proxy_cache_lock_timeout 60s;
          # Once an entry expires, one request refreshes it in the background while everyone else
          # keeps getting the stale copy - so an expiry never turns into a latency spike, and an
          # SSR hiccup never turns into an error page for a URL that was fine a minute ago.
          proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
          proxy_cache_background_update on;
          add_header X-SSR-Page-Cache $upstream_cache_status always;
        }

        location @csr_shell {
          internal;
          # Never cached, by nginx or by the visitor: this is a stand-in for a page, not the page.
          add_header Cache-Control "no-store" always;
          add_header X-SSR-Shell "1" always;
          try_files /index.csr.html =503;
        }
      }
    }
