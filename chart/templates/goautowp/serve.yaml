apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autowp.goautowp.serve.fullname" . | quote }}
spec:
  selector:
    matchLabels: {{ include "common.labels.matchLabels" . | nindent 6 }}
      app.kubernetes.io/component: goautowp-serve
  # 4 so the pods land 2-per-node on the two-node cluster (the podAntiAffinity below spreads
  # them); an odd count leaves one node carrying the extra SSR/backend pair.
  replicas: 4
  template:
    metadata:
      labels: {{- include "common.labels.standard" . | nindent 8 }}
        app.kubernetes.io/component: goautowp-serve
      annotations:
        checksum/config: {{ (tpl (.Files.Glob "configs/goautowp/*").AsConfig . ) | sha256sum }}
    spec:
      {{- include "autowp.imagePullSecrets" . | nindent 6 }}
      # Nothing in these containers talks to the Kubernetes API, so the token is only an
      # unnecessary credential sitting in the filesystem.
      automountServiceAccountToken: false
      volumes:
        - secret:
            defaultMode: 420
            secretName: {{ include "autowp.goautowp.fullname" . | quote }}
          name: config
        - name: tmp
          emptyDir: {}
        - name: frontend-assets
          emptyDir: {}
        - name: frontend-assets-nginx-tmp
          emptyDir: {}
        - name: licenses
          emptyDir: {}
        - name: frontend-assets-config
          configMap:
            name: {{ printf "%s-frontend-assets" (include "autowp.goautowp.serve.fullname" .) | quote }}
      initContainers:
        # The bundle lives in the frontend image; nginx serves it from a volume the two containers
        # share, so it has to be copied out once at startup. The frontend's own third-party
        # license notice sits alongside it (dist root, not under browser/) and gets copied to the
        # shared licenses volume at the same time - see the nginx location blocks in
        # frontend-assets-cm.yaml.
        - name: frontend-assets-copy
          image: {{ include "autowp.frontend.image" . }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy | quote }}
          command: ["sh", "-c", "cp -a /app/browser/. /srv/browser/ && cp /app/3rdpartylicenses.txt /srv/licenses/frontend-third-party-licenses.txt"]
          volumeMounts:
            - mountPath: /srv/browser
              name: frontend-assets
            - mountPath: /srv/licenses
              name: licenses
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              memory: 500M
              cpu: 1000m
            requests:
              memory: 10M
              cpu: 50m
        # Same idea for the backend image's own third-party license notice.
        - name: goautowp-licenses-copy
          image: {{ include "autowp.goautowp.image" . }}
          imagePullPolicy: {{ .Values.goautowp.image.pullPolicy | quote }}
          command: ["sh", "-c", "cp /THIRD_PARTY_LICENSES.txt /srv/licenses/backend-third-party-licenses.txt"]
          volumeMounts:
            - mountPath: /srv/licenses
              name: licenses
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              memory: 100M
              cpu: 500m
            requests:
              memory: 10M
              cpu: 50m
      containers:
        - name: frontend-assets
          image: {{ include "autowp.frontend.assets.image" . }}
          imagePullPolicy: {{ .Values.frontend.assets.image.pullPolicy | quote }}
          ports:
            - name: assets-port
              containerPort: {{ .Values.frontend.assets.port }}
          # Gates liveness/readiness until the sidecar's initContainer copy + nginx start finish; up
          # to failureThreshold*periodSeconds before the pod is declared failed.
          startupProbe:
            tcpSocket:
              port: assets-port
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: assets-port
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: assets-port
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - mountPath: /srv/browser
              name: frontend-assets
              readOnly: true
            - mountPath: /srv/licenses
              name: licenses
              readOnly: true
            - mountPath: /etc/nginx/nginx.conf
              name: frontend-assets-config
              subPath: nginx.conf
              readOnly: true
            - mountPath: /tmp
              name: frontend-assets-nginx-tmp
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              memory: 500M
              cpu: 2000m
            requests:
              memory: 10M
              cpu: 50m
        - name: frontend
          image: {{ include "autowp.frontend.image" . }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy | quote }}
          env:
            - name: SSR_WORKERS
              value: {{ .Values.frontend.workers | quote }}
            - name: SSR_CACHE_TTL_MS
              value: {{ .Values.frontend.ssrCache.ttlMs | quote }}
            - name: SSR_CACHE_MAX_BYTES
              value: {{ .Values.frontend.ssrCache.maxBytes | quote }}
            - name: SSR_MAX_CONCURRENT_RENDERS
              value: {{ .Values.frontend.render.maxConcurrent | quote }}
            - name: SSR_MAX_QUEUED_RENDERS
              value: {{ .Values.frontend.render.maxQueued | quote }}
            - name: SSR_QUEUE_TIMEOUT_MS
              value: {{ .Values.frontend.render.queueTimeoutMs | quote }}
            - name: NODE_OPTIONS
              value: {{ printf "--max-old-space-size=%v" .Values.frontend.maxOldSpaceSizeMb | quote }}
          ports:
            - name: frontend-port
              containerPort: 4000
          # SSR server forks its workers and warms up before it listens; keep liveness from firing
          # until then.
          startupProbe:
            tcpSocket:
              port: frontend-port
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: frontend-port
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: frontend-port
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              memory: 8Gi
              cpu: 4000m
            requests:
              memory: 1Gi
              cpu: 500m
        - name: goautowp-serve
          image: {{ include "autowp.goautowp.image" . }}
          imagePullPolicy: {{ .Values.goautowp.image.pullPolicy | quote }}
          args:
            - serve
            - --grpc
            - --attrs-update-values-amqp
            - --df-amqp
            - --monitoring-amqp
            - --autoban
            - --public
          ports:
            - name: app-port
              containerPort: 8080
            - name: grpc-port
              containerPort: 8082
            - name: metrics
              containerPort: 2112
          volumeMounts:
            - mountPath: /config.yaml
              name: config
              subPath: config.yaml
              readOnly: true
            - mountPath: /tmp
              name: tmp
          resources:
            limits:
              memory: 8Gi
              cpu: 4000m
            requests:
              memory: 1Gi
              cpu: 500m
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          # `serve` runs Postgres migrations before it opens the gRPC port. A cold start against a
          # busy database can take well over the old liveness initialDelaySeconds of 3s, which killed
          # the container mid-migration and crashlooped it. The startupProbe gives migrations up to
          # failureThreshold*periodSeconds (~5min) before liveness takes over.
          startupProbe:
            tcpSocket:
              port: grpc-port
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: grpc-port
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: grpc-port
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
      securityContext:
        runAsNonRoot: true
        fsGroup: 101
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                topologyKey: "kubernetes.io/hostname"
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - goautowp-serve
              weight: 100
