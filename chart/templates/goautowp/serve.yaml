apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autowp.goautowp.serve.fullname" . | quote }}
spec:
  selector:
    matchLabels: {{ include "common.labels.matchLabels" . | nindent 6 }}
      app.kubernetes.io/component: goautowp-serve
  replicas: 3
  template:
    metadata:
      labels: {{- include "common.labels.standard" . | nindent 8 }}
        app.kubernetes.io/component: goautowp-serve
      annotations:
        checksum/config: {{ (tpl (.Files.Glob "configs/goautowp/*").AsConfig . ) | sha256sum }}
    spec:
      {{- include "autowp.imagePullSecrets" . | nindent 6 }}
      volumes:
        - secret:
            defaultMode: 420
            secretName: {{ include "autowp.goautowp.fullname" . | quote }}
          name: config
        - name: tmp
          emptyDir: {}
        - name: frontend-assets
          emptyDir: {}
        - name: frontend-assets-nginx-tmp
          emptyDir: {}
        - name: frontend-assets-config
          configMap:
            name: {{ printf "%s-frontend-assets" (include "autowp.goautowp.serve.fullname" .) | quote }}
      initContainers:
        # The bundle lives in the frontend image; nginx serves it from a volume the two containers
        # share, so it has to be copied out once at startup.
        - name: frontend-assets-copy
          image: {{ include "autowp.frontend.image" . }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy | quote }}
          command: ["sh", "-c", "cp -a /app/browser/. /srv/browser/"]
          volumeMounts:
            - mountPath: /srv/browser
              name: frontend-assets
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              memory: 500M
              cpu: 1000m
            requests:
              memory: 10M
              cpu: 50m
      containers:
        - name: frontend-assets
          image: {{ include "autowp.frontend.assets.image" . }}
          imagePullPolicy: {{ .Values.frontend.assets.image.pullPolicy | quote }}
          ports:
            - name: assets-port
              containerPort: {{ .Values.frontend.assets.port }}
          livenessProbe:
            tcpSocket:
              port: assets-port
            initialDelaySeconds: 3
          readinessProbe:
            tcpSocket:
              port: assets-port
            initialDelaySeconds: 5
          volumeMounts:
            - mountPath: /srv/browser
              name: frontend-assets
              readOnly: true
            - mountPath: /etc/nginx/nginx.conf
              name: frontend-assets-config
              subPath: nginx.conf
              readOnly: true
            - mountPath: /tmp
              name: frontend-assets-nginx-tmp
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              memory: 500M
              cpu: 2000m
            requests:
              memory: 10M
              cpu: 50m
        - name: frontend
          image: {{ include "autowp.frontend.image" . }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy | quote }}
          env:
            - name: SSR_CACHE_TTL_MS
              value: {{ .Values.frontend.ssrCache.ttlMs | quote }}
            - name: SSR_CACHE_MAX_BYTES
              value: {{ .Values.frontend.ssrCache.maxBytes | quote }}
          ports:
            - name: frontend-port
              containerPort: 4000
          livenessProbe:
            tcpSocket:
              port: frontend-port
            initialDelaySeconds: 3
          readinessProbe:
            tcpSocket:
              port: frontend-port
            initialDelaySeconds: 5
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              memory: 5Gi
              cpu: 4000m
            requests:
              memory: 10M
              cpu: 50m
        - name: goautowp-serve
          image: {{ include "autowp.goautowp.image" . }}
          imagePullPolicy: {{ .Values.goautowp.image.pullPolicy | quote }}
          args:
            - serve
            - --grpc
            - --attrs-update-values-amqp
            - --df-amqp
            - --monitoring-amqp
            - --autoban
            - --public
          ports:
            - name: app-port
              containerPort: 8080
            - name: grpc-port
              containerPort: 8082
            - name: metrics
              containerPort: 2112
          volumeMounts:
            - mountPath: /config.yaml
              name: config
              subPath: config.yaml
              readOnly: true
            - mountPath: /tmp
              name: tmp
          resources:
            limits:
              memory: 5Gi
              cpu: 4000m
            requests:
              memory: 10M
              cpu: 50m
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            tcpSocket:
              port: grpc-port
            initialDelaySeconds: 3
          livenessProbe:
            tcpSocket:
              port: grpc-port
            initialDelaySeconds: 3
      securityContext:
        runAsNonRoot: true
        fsGroup: 101
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                topologyKey: "kubernetes.io/hostname"
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - goautowp-serve
              weight: 100
