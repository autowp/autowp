suite: Scheduled jobs RabbitMQ credentials
release:
  name: autowp
  namespace: autowp
templates:
  - goautowp/scheduler-daily-job.yaml
  - goautowp/scheduler-hourly-job.yaml
  - goautowp/scheduler-midnight-job.yaml
  - goautowp/scheduler-generate-index-cache.yaml
  - goautowp/pictures-clear-queue.yaml
tests:
  - it: reads the same password secret as the broker
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].env[0]
          value:
            name: RABBITMQ_PASSWORD
            valueFrom:
              secretKeyRef:
                name: autowp-rabbitmq
                key: password
