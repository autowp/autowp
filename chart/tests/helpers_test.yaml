suite: Application helpers without Bitnami common
release:
  name: autowp
  namespace: autowp
templates:
  - goautowp/serve.yaml
tests:
  - it: keeps existing resource names and immutable selectors
    asserts:
      - equal:
          path: metadata.name
          value: autowp-goautowp-serve
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: autowp
            app.kubernetes.io/instance: autowp
            app.kubernetes.io/component: goautowp-serve
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: autowp
  - it: preserves image digest precedence and global registry overrides
    set:
      fullnameOverride: custom
      global.imageRegistry: mirror.example.com
      goautowp.image.digest: sha256:0123456789abcdef
    asserts:
      - equal:
          path: metadata.name
          value: custom-goautowp-serve
      - contains:
          path: spec.template.spec.containers
          content:
            name: goautowp-serve
            image: mirror.example.com/autowp/autowp/goautowp@sha256:0123456789abcdef
          any: true
  - it: merges string and object pull secrets without duplicates
    set:
      global.imagePullSecrets:
        - shared
        - name: global-secret
      frontend.image.pullSecrets:
        - shared
        - name: frontend-secret
      goautowp.image.pullSecrets:
        - backend-secret
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: shared
            - name: global-secret
            - name: frontend-secret
            - name: backend-secret
  - it: renders with both dependencies disabled and no pull secrets
    set:
      rabbitmq.enabled: false
      valkey.enabled: false
      global.imagePullSecrets: []
      nameOverride: catalogue
    asserts:
      - equal:
          path: metadata.name
          value: autowp-catalogue-goautowp-serve
      - notExists:
          path: spec.template.spec.imagePullSecrets
