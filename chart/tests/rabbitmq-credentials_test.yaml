suite: Backend RabbitMQ credentials
release:
  name: autowp
  namespace: autowp
templates:
  - goautowp/serve.yaml
tests:
  - it: reads the broker password from its secret in the server and migration container
    asserts:
      - equal:
          path: spec.template.spec.containers[2].env[0]
          value:
            name: RABBITMQ_PASSWORD
            valueFrom:
              secretKeyRef:
                name: autowp-rabbitmq
                key: password
      - equal:
          path: spec.template.spec.initContainers[2].env[0]
          value:
            name: RABBITMQ_PASSWORD
            valueFrom:
              secretKeyRef:
                name: autowp-rabbitmq
                key: password
  - it: uses the same external secret and password key as the broker
    set:
      rabbitmq.auth.existingSecret: external-rabbitmq
      rabbitmq.auth.existingPasswordKey: broker-password
    asserts:
      - equal:
          path: spec.template.spec.containers[2].env[0].valueFrom.secretKeyRef
          value:
            name: external-rabbitmq
            key: broker-password
  - it: does not require a broker secret when RabbitMQ is disabled
    set:
      rabbitmq.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[2].env
      - notExists:
          path: spec.template.spec.initContainers[2].env
