version: "2"
run:
  allow-parallel-runners: true
linters:
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    # - cyclop # complexity metric largely redundant with gocognit/maintidx/wsl_v5; noisy on this codebase (50+ findings capped)
    - decorder
    # - depguard # needs a curated import allow/deny list to be meaningful; without one it denies every non-stdlib import repo-wide
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    # - exhaustruct # would force every struct literal to set every field, including options structs with intentional zero-value defaults
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funcorder
    # - funlen # complexity/length metric, noisy on this codebase (50+ findings capped) and overlaps maintidx/gocognit
    - ginkgolinter
    - gocheckcompilerdirectives
    # - gochecknoglobals # flags this codebase's normal package-level sentinel errors/regexes/config vars (50+ findings capped)
    - gochecknoinits
    - gochecksumtype
    # - gocognit # complexity metric, noisy on this codebase (41 findings) and overlaps maintidx/wsl_v5
    - goconst
    - gocritic
    # - gocyclo # complexity metric, noisy on this codebase (18 findings) and overlaps gocognit/maintidx
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    # - gosmopolitan # false positive: flags deliberate non-Latin test fixtures (Chinese strings in i18n/search tests)
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    # - ireturn # fights this codebase's intentional interface-returning APIs (e.g. items.AliaseableExpression query builders)
    - lll
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - musttag
    - nakedret
    # - nestif # complexity metric, noisy on this codebase (50+ findings capped) and overlaps gocognit/maintidx
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    # - noinlineerr # fights the idiomatic `if err := f(); err != nil` Go pattern used throughout this codebase
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    # - tagliatelle # would rename existing struct tags/JSON field names repo-wide (47 findings) - a breaking-change-risk scope, not a lint fix
    - testableexamples
    - testifylint
    # - testpackage # would force ~30 internal test files into external _test packages, likely requiring unexported helpers to be exported just to stay testable
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    # - wrapcheck # 476 findings repo-wide - wrapping every internal error at the call site is a large, high-risk refactor, not attempted in this pass
    # - wsl # superseded by wsl_v5, already enabled below
    - wsl_v5
    - zerologlint
  settings:
    gomoddirectives:
      replace-allow-list:
        - github.com/doug-martin/goqu/v9
    mnd:
      ignored-numbers:
        - "2"
        - "2.0"
    varnamelen:
      min-name-length: 2
      ignore-names:
        - i
        - j
        - k
    goconst:
      ignore-tests: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - spec_grpc.pb.go
      - spec.pb.go
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
  exclusions:
    generated: lax
    paths:
      - spec_grpc.pb.go
      - spec.pb.go
      - third_party$
      - builtin$
      - examples$
  settings:
    golines:
      max-len: 120
