name: autowp
services:
  createbuckets:
    image: amazon/aws-cli:2.37.4
    container_name: autowp_test_createbuckets
    depends_on:
      - minio
    volumes:
      - ./test/createbuckets.sh:/createbuckets.sh:ro
    environment:
      AWS_ENDPOINT_URL: "http://minio:9000"
      AWS_ACCESS_KEY_ID: "AKIAIOSFODNN7EXAMPLE"
      AWS_SECRET_ACCESS_KEY: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
      AWS_DEFAULT_REGION: "us-east-1"
    entrypoint: ["/createbuckets.sh", format, user, brand, picture, files, test, naming]

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: goautowp_keycloak_test
    depends_on:
      - postgres
    volumes:
      - ./test/realm.json:/opt/keycloak/data/import/realm.json
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: password
    ports:
      - '0.0.0.0:8081:8080'
    command:
      - "start"
      - "--import-realm"
      - --hostname=localhost
      - --http-enabled=true
      - --db=postgres
      - --db-url=jdbc:postgresql://postgres:5432/keycloak
      - --db-username=keycloak
      - --db-password=password
    restart: always

  minio:
    # RustFS (S3-compatible, Apache-2.0) under the historical "minio" service name/hostname that the
    # goautowp configs point to: MinIO images are no longer anonymously pullable.
    image: rustfs/rustfs:1.0.0
    container_name: goautowp_test_minio
    volumes:
      - s3-data:/data
    environment:
      RUSTFS_ACCESS_KEY: "AKIAIOSFODNN7EXAMPLE"
      RUSTFS_SECRET_KEY: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - '0.0.0.0:9001:9001'
      - '0.0.0.0:19000:9000'
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 8G
        reservations:
          cpus: "0.25"
          memory: 16M

  nginx:
    image: nginx:1-alpine
    container_name: goautowp_nginx_test
    volumes:
      - ./test:/usr/share/nginx/html:ro
    ports:
      - '0.0.0.0:80:80'
    restart: always

  postgres:
    image: postgis/postgis:18-3.6-alpine
    container_name: goautowp_postgres_test
    volumes:
      - ./test/postgres-initdb.d/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
      - ./test/postgres-initdb.d/create-keycloak-database.sh:/docker-entrypoint-initdb.d/create-keycloak-database.sh:ro
      - ./test/dump.sql:/dump.sql:ro
    environment:
      - POSTGRES_DB=traffic
      - POSTGRES_USER=traffic
      - POSTGRES_PASSWORD=password
      - KECYLOAK_DB_NAME=keycloak
      - KECYLOAK_DB_USER=keycloak
      - KECYLOAK_DB_PASSWORD=password
    ports:
      - '0.0.0.0:5432:5432'
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 8G
        reservations:
          cpus: "0.25"
          memory: 128M

  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: goautowp_rabbitmq_test
    ports:
      - '0.0.0.0:5672:5672'
      - '0.0.0.0:15672:15672'
    restart: always

  redis:
    image: redis:alpine
    container_name: goautowp_test_redis
    ports:
      - '0.0.0.0:6379:6379'
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 8G
        reservations:
          cpus: "0.25"
          memory: 128M
    expose:
      - '6379'

volumes:
  s3-data:
