name: autowp
services:
  createbuckets:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: autowp_test_createbuckets
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      while ! /usr/bin/mc alias set autowp http://minio:9000 AKIAIOSFODNN7EXAMPLE wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY;
        do echo 'Wait minio to startup...' && sleep 1;
      done;
      /usr/bin/mc mb autowp/format;
      /usr/bin/mc anonymous set download autowp/format;
      /usr/bin/mc mb autowp/user;
      /usr/bin/mc anonymous set download autowp/user;
      /usr/bin/mc mb autowp/brand;
      /usr/bin/mc anonymous set download autowp/brand;
      /usr/bin/mc mb autowp/picture;
      /usr/bin/mc anonymous set download autowp/picture;
      /usr/bin/mc mb autowp/files;
      /usr/bin/mc anonymous set download autowp/files;
      /usr/bin/mc mb autowp/test;
      /usr/bin/mc anonymous set download autowp/test;
      /usr/bin/mc mb autowp/naming;
      /usr/bin/mc anonymous set download autowp/naming;
      exit 0;
      "

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: goautowp_keycloak_test
    depends_on:
      - postgres-keycloak
    volumes:
      - ./test/realm.json:/opt/keycloak/data/import/realm.json
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: password
    ports:
      - '0.0.0.0:8081:8080'
    command:
      - "start"
      - "--import-realm"
      - --hostname=localhost
      - --http-enabled=true
      - --db=postgres
      - --db-url=jdbc:postgresql://postgres-keycloak:5432/keycloak
      - --db-username=keycloak
      - --db-password=password
    restart: always

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: goautowp_test_minio
    volumes:
      - ./minio/data:/data
    environment:
      MINIO_ROOT_USER: "AKIAIOSFODNN7EXAMPLE"
      MINIO_ROOT_PASSWORD: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
    ports:
      - '0.0.0.0:9001:9001'
      - '0.0.0.0:19000:9000'
    command: server --console-address ":9001" /data
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 8G
        reservations:
          cpus: "0.25"
          memory: 16M
    privileged: true

  mysql:
    image: mysql:8
    container_name: goautowp_mysql_test
    volumes:
      - ./test/dump.sql:/dump.sql:ro
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=autowp
    ports:
      - '0.0.0.0:3306:3306'
    restart: always

  nginx:
    image: nginx:1-alpine
    container_name: goautowp_nginx_test
    volumes:
      - ./test:/usr/share/nginx/html:ro
    ports:
      - '0.0.0.0:80:80'
    restart: always

  postgres:
    image: postgres:13-alpine
    container_name: goautowp_postgres_test
    volumes:
      - ./test/pg.sql:/pg.sql:ro
    environment:
      - POSTGRES_DB=traffic
      - POSTGRES_USER=traffic
      - POSTGRES_PASSWORD=password
    ports:
      - '0.0.0.0:5432:5432'
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 8G
        reservations:
          cpus: "0.25"
          memory: 128M

  postgres-keycloak:
    image: postgres:13-alpine
    container_name: goautowp_postgres_keycloak_test
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=password
    ports:
      - '0.0.0.0:5433:5432'
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 8G
        reservations:
          cpus: "0.25"
          memory: 128M
  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: goautowp_rabbitmq_test
    ports:
      - '0.0.0.0:5672:5672'
      - '0.0.0.0:15672:15672'
    restart: always

  redis:
    image: redis:alpine
    container_name: goautowp_test_redis
    ports:
      - '0.0.0.0:6379:6379'
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 8G
        reservations:
          cpus: "0.25"
          memory: 128M
    expose:
      - '6379'
