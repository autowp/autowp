<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item">
      <a routerLink="/" i18n>Index page</a>
    </li>
  </ol>
</nav>

<div class="page-header">
  <h1 i18n>Categories</h1>
</div>

@if (itemsResource.error(); as error) {
  <p class="alert alert-danger" role="alert">{{ error.message }}</p>
} @else if (chunks(); as chunks) {
  @for (chunk of chunks; track chunk) {
    <div class="row">
      @for (item of chunk; track item.id) {
        <div class="col-md-3">
          <app-categories-index-item [item]="item" />
        </div>
      }
    </div>
  }
} @else {
  <div class="spinner-border" role="status"><span class="visually-hidden" i18n>Loading…</span></div>
}
