@if (pictureResource.error(); as error) {
  <p class="alert alert-danger" role="alert">{{ errorMessage(error) }}</p>
} @else if (pictureResource.value(); as picture) {
  <app-picture
    [picture]="picture"
    [prefix]="currentRouterLinkPrefix() || []"
    [galleryRoute]="currentRouterLinkGallery() || []"
    [h2]="true"
    (changed)="reloadPicture()"
  />
  <div id="comments">
    <!-- eslint-disable prettier/prettier -->
    @defer (on viewport) {
      <app-comments [typeID]="CommentsType.PICTURES_TYPE_ID" [itemID]="picture.id" [limit]="null" />
    } @placeholder {<div class="spinner-border" role="status"><span class="visually-hidden" i18n>Loading…</span></div>}
    <!-- eslint-enable prettier/prettier -->
  </div>
} @else {
  <div class="spinner-border" role="status"><span class="visually-hidden" i18n>Loading…</span></div>
}
