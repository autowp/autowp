<form class="add-message" method="post" novalidate (submit)="$event.preventDefault(); sendMessage()">
  <fieldset>
    <legend i18n>Add comment</legend>
    <div class="mb-3">
      <div class="controls">
        <textarea
          cols="80"
          rows="5"
          class="form-control"
          [class.is-invalid]="invalidParams() && invalidParams()['message']"
          [formField]="form.message"
        ></textarea>
        @for (message of invalidParams() | invalidParams: 'message'; track message) {
          <p class="invalid-feedback">{{ message }}</p>
        }
      </div>
    </div>
    <div class="mb-3">
      <div class="controls checkbox">
        <div class="float-end cancel">
          <button type="button" class="btn btn-sm btn-warning" i18n (click)="cancel()">Cancel</button>
        </div>
        <label>
          <input type="checkbox" [formField]="form.moderator_attention" />&ngsp;
          <ng-container i18n>It requires attention of moderators</ng-container>
        </label>
      </div>
    </div>
    <div>
      <button type="submit" class="btn btn-primary" i18n [disabled]="form().submitting()">Send</button>
    </div>
  </fieldset>
</form>
