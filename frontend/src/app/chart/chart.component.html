<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item">
      <a routerLink="/" i18n>Index page</a>
    </li>
  </ol>
</nav>

<div class="page-header">
  <h1>Charts</h1>
</div>

<div>
  @if (parameters$ | async; as parameters) {
    <div class="nav nav-pills">
      @for (param of parameters; track param.id) {
        <a
          class="nav-link"
          href="#"
          [class.active]="$index === activeParameter()"
          (click)="selectParam(parameters, $index)"
          >{{ param.name }}</a
        >
      }
    </div>
  }
  @if (chart.data.length) {
    <canvas
      baseChart
      width="400"
      height="250"
      type="line"
      [datasets]="chart.data"
      [labels]="chart.labels"
      [options]="chartOptions"
      [legend]="true"
    ></canvas>
  }
</div>
