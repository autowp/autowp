<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item">
      <a routerLink="/" i18n>Index page</a>
    </li>
  </ol>
</nav>

<div class="page-header">
  <h1 i18n>Mascots</h1>
</div>

@if (dataResource.error(); as error) {
  <p class="alert alert-danger" role="alert">{{ error.message }}</p>
} @else if (dataResource.isLoading()) {
  <div class="spinner-border" role="status"><span class="visually-hidden" i18n>Loading…</span></div>
} @else if (dataResource.value(); as data) {
  <div class="row">
    @for (picture of data.items || []; track picture) {
      <div class="col-6 col-md-4 col-lg-3">
        <app-thumbnail [picture]="picture" [route]="['/picture', picture.identity]" />
      </div>
    }
  </div>
  @if (data.paginator) {
    <app-paginator [data]="data.paginator" />
  }
}
