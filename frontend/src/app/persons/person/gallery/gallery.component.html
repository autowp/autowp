@if (itemID(); as itemID) {
  @if (identity(); as identity) {
    <app-gallery
      [filter]="{exactItemID: itemID, exactItemLinkType: PictureItemType.PICTURE_ITEM_CONTENT}"
      [current]="identity"
      [galleryPrefix]="['/persons', itemID, 'gallery']"
      [picturePrefix]="['/persons', itemID]"
      (pictureSelected)="pictureSelected($event)"
    />
  }
}
