@if (pictureResource.error(); as error) {
  <p class="alert alert-danger" role="alert">{{ errorMessage(error) }}</p>
} @else if (pictureResource.value(); as picture) {
  <app-picture
    [picture]="picture"
    [prefix]="['/persons', itemID()]"
    [galleryRoute]="['/persons', itemID(), 'gallery', identity() ?? '']"
    (changed)="reloadPicture()"
  />
  <div id="comments">
    <app-comments [typeID]="CommentsType.PICTURES_TYPE_ID" [itemID]="picture.id" [limit]="null" />
  </div>
}
