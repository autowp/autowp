@if (!pageEnv.layoutParams().isGalleryPage) {
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item">
        <a routerLink="/" i18n>Index page</a>
      </li>
      <li class="breadcrumb-item">
        <a routerLink="/persons" i18n>Persons</a>
      </li>
    </ol>
  </nav>

  @if (itemResource.error(); as error) {
    <p class="alert alert-danger" role="alert">{{ errorMessage(error) }}</p>
  } @else if (itemResource.isLoading()) {
    <div class="spinner-border" role="status"><span class="visually-hidden" i18n>Loading…</span></div>
  } @else if (itemResource.value(); as item) {
    <div class="page-header">
      <h1 [innerHTML]="item.nameHtml"></h1>
    </div>
    @if (isModer$ | async) {
      <p>
        <i class="bi bi-gear-fill me-1" aria-hidden="true"></i>
        <a i18n [routerLink]="['/moder/items/item', item.id]">edit</a>
      </p>
    }
  }
}

<router-outlet />
