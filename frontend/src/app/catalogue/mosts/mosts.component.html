<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item">
      <a routerLink="/" i18n>Index page</a>
    </li>
    @if (brandData(); as brand) {
      <li class="breadcrumb-item">
        <a [routerLink]="['/', brand.catname]" [innerHTML]="brand.nameHtml"></a>
      </li>
    }
  </ol>
</nav>

@if (brandResource.error(); as error) {
  <p class="alert alert-danger" role="alert">{{ errorMessage(error) }}</p>
} @else if (brandResource.isLoading()) {
  <div class="spinner-border" role="status"><span class="visually-hidden" i18n>Loading…</span></div>
} @else if (brandResource.value(); as brand) {
  <app-mosts-contents
    [prefix]="['/', brand.catname, 'mosts']"
    [ratingCatname]="ratingCatname()"
    [typeCatname]="typeCatname()"
    [yearsCatname]="yearsCatname()"
    [brandID]="brand.id"
  />
}
