@if (deedUrl(); as url) {
  <a target="_blank" rel="noopener" [class]="badgeClass()" [href]="url">{{ label() }}</a>
} @else {
  <span [class]="badgeClass()">{{ label() }}</span>
}
@if (sourceUrl()) {
  <a class="ms-1" target="_blank" rel="noopener" [href]="sourceUrl()">
    <i class="bi bi-box-arrow-up-right me-1" aria-hidden="true"></i>
    <ng-container i18n>Source</ng-container>
  </a>
}
