<a [routerLink]="routerLink()">{{ name() }}</a
>&ngsp;<!-- prettier-ignore --><span class="count"
  >({{ count() }}@if (newCount() > 0) {<span
      triggers="mouseenter:mouseleave"
      container="body"
      [class.has-popover]="!!popover()"
      [ngbPopover]="popover()"
      [popoverTitle]="popoverTitle()"
      >+{{ newCount() }}</span
    >})</span
>
