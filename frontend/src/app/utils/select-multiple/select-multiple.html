<select
  #select
  multiple
  class="form-select form-select-sm"
  [disabled]="disabled()"
  [attr.aria-label]="label()"
  (change)="onChange(select)"
  (blur)="touch.emit()"
>
  @for (option of options(); track option.id) {
    <option [value]="option.id" [selected]="value().includes(option.id)">{{ option.name }}</option>
  }
</select>
