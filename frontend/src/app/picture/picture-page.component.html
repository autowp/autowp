<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item">
      <a routerLink="/" i18n>Index page</a>
    </li>
  </ol>
</nav>

@if (canonicalResource.error() ?? pictureResource.error(); as error) {
  <p class="alert alert-danger" role="alert">{{ errorMessage(error) }}</p>
} @else if (canonicalResource.isLoading() || pictureResource.isLoading()) {
  <div class="spinner-border" role="status"><span class="visually-hidden" i18n>Loading…</span></div>
} @else if (pictureResource.value(); as picture) {
  <div>
    <app-picture
      [picture]="picture"
      [prefix]="['/picture']"
      [galleryRoute]="['/gallery', picture.identity]"
      (changed)="reloadPicture()"
    />
    <div id="comments">
      @defer (hydrate on viewport) {
        <app-comments [typeID]="CommentsType.PICTURES_TYPE_ID" [itemID]="picture.id" [limit]="null" />
      }
    </div>
  </div>
}
