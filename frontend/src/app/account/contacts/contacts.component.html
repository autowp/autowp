<div class="page-header">
  <h1 i18n>Contacts</h1>
</div>
<div class="row">
  @for (contact of items$ | async; track contact.contactUserId) {
    @if (contact.user) {
      <div class="col-md-6 mb-2">
        <div class="d-flex justify-content-start">
          <div class="align-self-start me-3">
            @if (!contact.user.deleted) {
              <a
                class="photo"
                [routerLink]="['/users', contact.user.identity ? contact.user.identity : 'user' + contact.user.id]"
              >
                @if (contact.user.avatar) {
                  <img alt="" class="rounded" loading="lazy" [src]="contact.user.avatar.src" />
                } @else if (contact.user.gravatar) {
                  <img alt="" class="rounded" loading="lazy" [src]="contact.user.gravatar" />
                }
              </a>
            }
          </div>
          <div class="flex-grow-1">
            <button type="button" class="btn-close float-end" (click)="deleteContact(contact.user.id)"></button>
            <h4>
              <app-user [user]="contact.user" />
            </h4>
            @if (contact.user.lastOnline; as date) {
              <p [ngbTooltip]="date.toDate() | date: 'medium'">{{ date.toDate() | timeAgo }}</p>
            }
          </div>
        </div>
      </div>
    }
  }
</div>
