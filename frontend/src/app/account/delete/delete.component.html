<div class="page-header">
  <h1 i18n>Account delete</h1>
</div>
<div class="card card-body">
  <remark
    i18n-markdown
    markdown="We're sorry that you ended up on this page, planning to leave our site for good, but we cannot refuse you that.

By clicking the red button, all data concerning you will be anonymized or deleted.

This process is irreversible, so think it over carefully and don't make a hasty decision."
  />
  <hr />
  <form class="form-horizontal" (submit)="submit()">
    <div class="mb-3 row">
      <label class="col-md-2 col-form-label" for="password_old" i18n="@@user/password">Password</label>
      <div class="col-md-10">
        <input
          id="password_old"
          type="password"
          size="50"
          maxlength="50"
          name="password_old"
          class="form-control"
          [class.is-invalid]="invalidParams() && invalidParams()['password_old']"
          [(ngModel)]="form.password_old"
        />
        @for (message of invalidParams() | invalidParams: 'password_old'; track message) {
          <p class="invalid-feedback">{{ message }}</p>
        }
      </div>
    </div>
    <div class="row">
      <div class="col-md-10 offset-md-2">
        <button type="submit" class="btn btn-primary" i18n>send</button>
      </div>
    </div>
  </form>
</div>
