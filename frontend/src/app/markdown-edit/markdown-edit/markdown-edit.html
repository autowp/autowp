<ul #nav="ngbNav" ngbNav class="nav-tabs">
  <li ngbNavItem>
    <a ngbNavLink i18n>Edit</a>
    <ng-template ngbNavContent>
      @let control = textForm;
      <textarea class="form-control" rows="1" aria-label="Text" cdkTextareaAutosize [formField]="control"></textarea>
    </ng-template>
  </li>
  <li ngbNavItem [disabled]="!text() || !text().length">
    <a ngbNavLink i18n>Preview</a>
    <ng-template ngbNavContent>
      <div class="card card-body">
        <remark [markdown]="text()" />
      </div>
    </ng-template>
  </li>
</ul>
<div [ngbNavOutlet]="nav"></div>
