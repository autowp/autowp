@if (groupId(); as groupId) {
  @if (childsResource.value(); as childs) {
    @for (item of childs.items; track item.id) {
      <app-twins-item [groupId]="groupId" [item]="item" />
    }
  }

  @if (groupResource.value(); as group) {
    @if (group.description) {
      <div>
        <h3 i18n>Description</h3>
        <div class="card card-body">
          <remark [markdown]="group.description" />
        </div>
      </div>
    }
  }
  <app-comments [itemID]="groupId" [typeID]="CommentsType.ITEM_TYPE_ID" />
}
