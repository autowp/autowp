@if (groupResource.error(); as error) {
  <p class="alert alert-danger" role="alert">{{ error.message }}</p>
} @else if (groupResource.isLoading()) {
  <div class="spinner-border" role="status"><span class="visually-hidden" i18n>Loading…</span></div>
} @else if (groupResource.value(); as group) {
  @if (identity(); as identity) {
    <app-gallery
      [filter]="{itemID: group.id}"
      [current]="identity"
      [galleryPrefix]="['/twins/group', group.id, 'gallery']"
      [picturePrefix]="['/twins/group', group.id, 'pictures']"
      (pictureSelected)="pictureSelected($event)"
    />
  }
}
