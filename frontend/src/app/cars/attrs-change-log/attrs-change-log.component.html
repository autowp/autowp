<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item">
      <a routerLink="/" i18n>Index page</a>
    </li>
  </ol>
</nav>

<div class="page-header">
  <h1 i18n id="header">History</h1>
</div>

<div class="card card-body">
  <form class="form-horizontal">
    <div class="mb-3 row">
      <label class="col-md-2 col-form-label" for="user_id" i18n>User</label>
      <div class="col-md-10">
        <ng-template #userTemplate let-model="result">
          <span [innerHTML]="model.name"></span>
        </ng-template>
        <div class="input-group mb-3">
          <input
            name="user"
            class="form-control"
            id="user_id"
            [ngbTypeahead]="usersDataSource"
            [formControl]="userQuery"
            [inputFormatter]="userFormatter"
            [resultTemplate]="userTemplate"
            [class.border-primary]="hasUserID()"
            (selectItem)="userOnSelect($event)"
          />
          <button
            class="btn btn-outline-secondary"
            type="button"
            [disabled]="!hasUserID()"
            (click)="clearUser(userQuery)"
          >
            <span class="bi bi-x" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </div>
  </form>
  <table class="specs-log table table-striped" aria-describedby="header">
    <thead>
      <tr>
        <th i18n scope="col">Date</th>
        <th i18n scope="col">User</th>
        <th i18n scope="col">Object</th>
        <th i18n scope="col">Attribute</th>
        <th i18n scope="col">Value</th>
        <th i18n scope="col">Editor</th>
      </tr>
    </thead>
    <tbody>
      @if (itemsResource.error(); as error) {
        <tr>
          <td colspan="6">
            <p class="alert alert-danger" role="alert">{{ errorMessage(error) }}</p>
          </td>
        </tr>
      } @else if (itemsResource.value(); as items) {
        @for (userValue of items; track userValue) {
          <tr app-cars-attrs-change-log-row [userValue]="userValue"></tr>
        }
      }
    </tbody>
  </table>
</div>
