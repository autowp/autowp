<div class="modal-header">
  <h3 class="modal-title" i18n>Send personal message</h3>
  <button class="btn-close" type="button" (click)="activeModal.dismiss()"></button>
</div>
<div class="modal-body">
  <textarea
    cols="65"
    rows="5"
    class="form-control"
    placeholder="Message"
    i18n-placeholder
    [formField]="form.text"
    (keypress)="keypress()"
  ></textarea>
</div>
<div class="modal-footer">
  <button
    type="button"
    class="btn"
    [disabled]="form().submitting() || form().invalid()"
    [class.btn-success]="sent()"
    [class.btn-primary]="!sent()"
    (click)="send()"
  >
    @if (form().submitting()) {
      <span i18n>sending …</span>
    }
    @if (sent()) {
      <span i18n>sent</span>
    }
    @if (!form().submitting() && !sent()) {
      <span i18n>send</span>
    }
  </button>
  <button
    type="button"
    class="btn btn-secondary cancel"
    i18n
    [disabled]="form().submitting()"
    (click)="activeModal.dismiss()"
  >
    cancel
  </button>
</div>
