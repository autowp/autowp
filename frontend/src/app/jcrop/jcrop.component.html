<!--
  Jcrop's fixed-identity container elements, already nested the way the constructor's own init
  effect() (jcrop.component.ts) expects them. Every mousedown/touchstart below is bound directly on
  its own static, permanent element rather than attached/detached imperatively, since none of these
  elements ever come or go for the life of this component.
-->
<div class="jcrop-holder" [style.height.px]="displayHeight()" [style.width.px]="displayWidth()">
  <div
    class="jcrop-sel"
    [style.display]="selectionAwake() ? '' : 'none'"
    [style.left.px]="selLeft()"
    [style.top.px]="selTop()"
    [style.height.px]="selHeight()"
    [style.width.px]="selWidth()"
  >
    <div class="jcrop-img-holder">
      <!-- Fully static: opacity/position come from .jcrop-vline/.jcrop-hline (jcrop.component.scss) -
           contrast the dragbars/handles below, which still get mousedown/touchstart wired up to
           onDragStart below. -->
      <div class="jcrop-hline"></div>
      <div class="jcrop-hline bottom"></div>
      <div class="jcrop-vline right"></div>
      <div class="jcrop-vline"></div>
      <div
        class="jcrop-tracker jcrop-selection-tracker"
        (mousedown)="onSelectionTrackerStart($event)"
        (touchstart)="onSelectionTrackerStart($event)"
      ></div>
      <img
        alt=""
        class="jcrop-preview"
        [src]="src()"
        [style.height.px]="displayHeight()"
        [style.width.px]="displayWidth()"
        [style.left.px]="img2Left()"
        [style.top.px]="img2Top()"
      />
    </div>
    <div class="jcrop-handles-holder" [style.display]="handlesVisible() ? '' : 'none'">
      <!-- cursor/opacity/position/class are static (jcrop.component.scss); z-index is inline since
           it's the one thing genuinely unique per element, not shareable via a class. -->
      @for (dragbar of dragbars; track dragbar.ord) {
        <div
          class="jcrop-dragbar ord-{{ dragbar.ord }}"
          [style.z-index]="dragbar.zIndex"
          (mousedown)="onDragStart(dragbar.ord, $event)"
          (touchstart)="onDragStart(dragbar.ord, $event)"
        ></div>
      }
      @for (handle of handles; track handle.ord) {
        <div
          class="jcrop-handle ord-{{ handle.ord }}"
          [style.z-index]="handle.zIndex"
          (mousedown)="onDragStart(handle.ord, $event)"
          (touchstart)="onDragStart(handle.ord, $event)"
        ></div>
      }
    </div>
  </div>
  <div
    class="jcrop-tracker"
    [style.cursor]="trackerCursor()"
    [style.z-index]="trackerZIndex()"
    [style.height.px]="trackerHeight()"
    [style.width.px]="trackerWidth()"
    [style.left.px]="trackerOffset"
    [style.top.px]="trackerOffset"
    (mousedown)="onTrackerStart($event)"
    (touchstart)="onTrackerStart($event)"
  ></div>
  <img
    #workingImg
    alt=""
    class="jcrop-working-image"
    [src]="src()"
    [style.opacity]="imgOpacity()"
    [style.height.px]="displayHeight()"
    [style.width.px]="displayWidth()"
  />
</div>
