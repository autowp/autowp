<img
  alt=""
  [src]="src()"
  [style.display]="origimgVisible() ? '' : 'none'"
  [style.visibility]="origimgVisible() ? 'visible' : ''"
  (load)="onLoad($event)"
/>
<!--
  Jcrop's fixed-identity container elements - declared here, already nested the way #init()
  (jcrop.component.ts) expects them, so it doesn't have to build any of them with
  document.createElement() or reparent them into place itself. #workingImg and #img2 are the latest
  to move here: they used to be a runtime clone of the real <img> above (origimg.cloneNode(true)) and
  a runtime document.createElement('img') respectively, both now just bound the same way the real
  <img>'s own src is ([src]="src()"). Classes/inline styles below are exactly what #init() used to set
  imperatively for properties that never change at runtime - anything that does from runtime layout
  math (size, position while dragging) is either still set imperatively (#workingImg's own
  height/width - see the origimgVisible comment in jcrop.component.ts for why; and #sel's
  left/top/height/width, updated on every drag frame by Selection - not shown here since Selection
  owns it directly, not #init(), and left as a direct DOM write rather than a signal to avoid a
  change-detection pass of lag on every drag frame) or, where it's a one-time computation or a
  per-gesture state transition instead, driven by a signal: #hdlHolder's visibility
  (Selection#disableHandles()/enableHandles()) via handlesVisible; #sel's own display
  (Selection#release()/#show(), once per drag gesture rather than per frame) via selVisible;
  #workingImg's opacity (that same release()/show() dimming the image while a selection is awake) via
  imgOpacity; #holder's and #img2's height/width (computed in #init() from the loaded image's size)
  via holderHeight/holderWidth and img2Height/img2Width; and #tracker's cursor/z-index (the
  component's own drag-mode changes) plus its height/width/left/top (that same one-time #init()
  computation) via trackerCursor/trackerZIndex/trackerHeight/trackerWidth/trackerOffset. Likewise,
  every mousedown/touchstart below is exactly what #init() and the Selection class (Jcrop.ts) used to
  attach imperatively with addEventListener() - all of these elements are static and permanent for the
  life of this component, so there's no need to attach/detach anything by hand.
  #tracker/#selectionTracker call straight into the drag logic (onTrackerMouseDown et al.); the
  handle/dragbar elements instead forward through onDragMouseDown/onDragTouchStart, passing along the
  fixed ordinal each one already knows, since Selection itself no longer listens for DOM events at all
  - see Selection#dragStart/touchDragStart.
-->
<div #holder class="jcrop-holder" [style.height.px]="holderHeight()" [style.width.px]="holderWidth()">
  <div #sel style="position: absolute; z-index: 600" [style.display]="selVisible() ? '' : 'none'">
    <div #imgHolder style="position: absolute; overflow: hidden; height: 100%; width: 100%; z-index: 310">
      <!-- Fully static: opacity/position come from .jcrop-vline/.jcrop-hline (jcrop.component.scss),
           and Selection never touches these at all any more (contrast the dragbars/handles below,
           which still get mousedown/touchstart wired up in Jcrop.ts). -->
      <div #borderN class="jcrop-hline"></div>
      <div #borderS class="jcrop-hline bottom"></div>
      <div #borderE class="jcrop-vline right"></div>
      <div #borderW class="jcrop-vline"></div>
      <div
        #selectionTracker
        class="jcrop-tracker"
        style="cursor: move; z-index: 360"
        (mousedown)="onSelectionTrackerMouseDown($event)"
        (touchstart)="onSelectionTrackerTouchStart($event)"
      ></div>
      <img
        #img2
        alt=""
        style="position: absolute; border: none; margin: 0; padding: 0; top: 0; left: 0; visibility: visible"
        [src]="src()"
        [style.height.px]="img2Height()"
        [style.width.px]="img2Width()"
      />
    </div>
    <div #hdlHolder style="height: 100%; width: 100%; z-index: 320" [style.display]="handlesVisible() ? '' : 'none'">
      <!-- cursor/opacity/position/class are static (jcrop.component.scss); z-index is inline since
           it's the one thing genuinely unique per element, not shareable via a class. Each still
           forwards mousedown/touchstart into Selection (via onDragMouseDown/onDragTouchStart, passing
           its own fixed ordinal) - fixed in number and identity now, but still real drag targets,
           unlike the borders above. -->
      <div
        #dragbarN
        class="jcrop-dragbar ord-n"
        style="z-index: 370"
        (mousedown)="onDragMouseDown('n', $event)"
        (touchstart)="onDragTouchStart('n', $event)"
      ></div>
      <div
        #dragbarS
        class="jcrop-dragbar ord-s"
        style="z-index: 371"
        (mousedown)="onDragMouseDown('s', $event)"
        (touchstart)="onDragTouchStart('s', $event)"
      ></div>
      <div
        #dragbarE
        class="jcrop-dragbar ord-e"
        style="z-index: 372"
        (mousedown)="onDragMouseDown('e', $event)"
        (touchstart)="onDragTouchStart('e', $event)"
      ></div>
      <div
        #dragbarW
        class="jcrop-dragbar ord-w"
        style="z-index: 373"
        (mousedown)="onDragMouseDown('w', $event)"
        (touchstart)="onDragTouchStart('w', $event)"
      ></div>
      <div
        #handleN
        class="jcrop-handle ord-n"
        style="z-index: 374"
        (mousedown)="onDragMouseDown('n', $event)"
        (touchstart)="onDragTouchStart('n', $event)"
      ></div>
      <div
        #handleS
        class="jcrop-handle ord-s"
        style="z-index: 375"
        (mousedown)="onDragMouseDown('s', $event)"
        (touchstart)="onDragTouchStart('s', $event)"
      ></div>
      <div
        #handleE
        class="jcrop-handle ord-e"
        style="z-index: 376"
        (mousedown)="onDragMouseDown('e', $event)"
        (touchstart)="onDragTouchStart('e', $event)"
      ></div>
      <div
        #handleW
        class="jcrop-handle ord-w"
        style="z-index: 377"
        (mousedown)="onDragMouseDown('w', $event)"
        (touchstart)="onDragTouchStart('w', $event)"
      ></div>
      <div
        #handleNw
        class="jcrop-handle ord-nw"
        style="z-index: 378"
        (mousedown)="onDragMouseDown('nw', $event)"
        (touchstart)="onDragTouchStart('nw', $event)"
      ></div>
      <div
        #handleNe
        class="jcrop-handle ord-ne"
        style="z-index: 379"
        (mousedown)="onDragMouseDown('ne', $event)"
        (touchstart)="onDragTouchStart('ne', $event)"
      ></div>
      <div
        #handleSe
        class="jcrop-handle ord-se"
        style="z-index: 380"
        (mousedown)="onDragMouseDown('se', $event)"
        (touchstart)="onDragTouchStart('se', $event)"
      ></div>
      <div
        #handleSw
        class="jcrop-handle ord-sw"
        style="z-index: 381"
        (mousedown)="onDragMouseDown('sw', $event)"
        (touchstart)="onDragTouchStart('sw', $event)"
      ></div>
    </div>
  </div>
  <div
    class="jcrop-tracker"
    [style.cursor]="trackerCursor()"
    [style.z-index]="trackerZIndex()"
    [style.height.px]="trackerHeight()"
    [style.width.px]="trackerWidth()"
    [style.left.px]="trackerOffset()"
    [style.top.px]="trackerOffset()"
    (mousedown)="onTrackerMouseDown($event)"
    (touchstart)="onTrackerTouchStart($event)"
  ></div>
  <img
    #workingImg
    alt=""
    style="position: absolute; border: none; margin: 0; padding: 0; top: 0; left: 0; visibility: visible"
    [src]="src()"
    [style.opacity]="imgOpacity()"
  />
</div>
