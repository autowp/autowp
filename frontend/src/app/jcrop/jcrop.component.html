<img alt="" [src]="src()" (load)="onLoad($event)" />
<!--
  Jcrop's fixed-identity container elements (see JcropElements in Jcrop.ts) - declared here, already
  nested the way Jcrop's constructor expects them, so it doesn't have to build them with
  document.createElement() or reparent them into place itself. The one thing Jcrop still appends here
  imperatively is the cloned working <img> (into #holder) - it can't be a static element since it's a
  runtime clone of the img above. Classes/inline styles below are exactly what Jcrop.ts used to set
  imperatively for properties that never change at runtime - anything that does (size, position while
  dragging, z-index while tracking, visibility) is still set from there.
-->
<div #holder class="jcrop-holder">
  <div #sel style="position: absolute; z-index: 600">
    <div #imgHolder style="position: absolute; overflow: hidden; height: 100%; width: 100%; z-index: 310">
      <div #selectionTracker class="jcrop-tracker" style="cursor: move; z-index: 360"></div>
    </div>
    <div #hdlHolder style="height: 100%; width: 100%; z-index: 320"></div>
  </div>
  <div #tracker class="jcrop-tracker"></div>
</div>
