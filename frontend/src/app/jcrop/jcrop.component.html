<!--
  Jcrop's fixed-identity container elements - declared here, already nested the way the constructor's
  own init effect() (jcrop.component.ts) expects them, so it doesn't have to build any of them with
  document.createElement() or reparent them into place itself. #workingImg and #img2 are the latest
  to move here: they used to be a runtime clone of a separate, hidden <img> (origimg.cloneNode(true))
  and a runtime document.createElement('img') respectively - #workingImg is now that <img> itself
  (its own (load) event mattered once, back when that hidden <img>'s load was what triggered
  initialization - it doesn't any more, see the effect()'s own comment for why), and #img2 is just
  bound the same way #workingImg's own src is ([src]="src()"). Classes/inline styles below are
  exactly what that effect() used to set imperatively for properties that never change at runtime -
  anything that does from runtime
  state is driven by a signal instead: .jcrop-handles-holder's visibility (set directly by this
  component's own #setSelect()/#doneSelect()/#newSelection()) via handlesVisible; #sel's own display
  (#doneSelect()/#selectionUpdate()) via selVisible; #workingImg's opacity (that same release/show
  dimming the image while a selection is awake) via imgOpacity; #workingImg's, #holder's, #tracker's,
  and #img2's height/width (all computed() straight off pictureWidth/pictureHeight and the real page
  container's own layout - see the displayWidth/displayHeight comment in jcrop.component.ts) via
  displayWidth/displayHeight directly (#holder's and #img2's are exactly displayWidth/displayHeight,
  #tracker's adds the fixed BOUNDARY margin via trackerHeight/trackerWidth); #sel's height/width
  (resized on every drag frame by
  #selectionUpdate()) via selHeight/selWidth; #img2's and #sel's own left/top (#selectionUpdate(), on
  every drag frame) via img2Left/img2Top and selLeft/selTop; and #tracker's cursor/z-index (the
  component's own drag-mode changes, via trackerCursor/trackerZIndex). #tracker's own left/top are
  the plain trackerOffset constant instead (jcrop.component.ts). Likewise, every mousedown/touchstart
  below is exactly what that same effect() and what used to be a separate Selection class (Jcrop.ts)
  used to attach imperatively with addEventListener() - all of these elements are static and permanent for
  the life of this component, so there's no need to attach/detach anything by hand.
  #tracker/#selectionTracker call straight into the drag logic (onTrackerMouseDown et al.); the
  handle/dragbar elements instead forward through onDragMouseDown/onDragTouchStart, passing along the
  fixed ordinal each one already knows straight into #createDragger() (jcrop.component.ts).
-->
<div class="jcrop-holder" [style.height.px]="displayHeight()" [style.width.px]="displayWidth()">
  <div
    class="jcrop-sel"
    [style.display]="selVisible() ? '' : 'none'"
    [style.left.px]="selLeft()"
    [style.top.px]="selTop()"
    [style.height.px]="selHeight()"
    [style.width.px]="selWidth()"
  >
    <div class="jcrop-img-holder">
      <!-- Fully static: opacity/position come from .jcrop-vline/.jcrop-hline (jcrop.component.scss),
           and nothing touches these at all any more (contrast the dragbars/handles below, which still
           get mousedown/touchstart wired up to onDragMouseDown/onDragTouchStart below). -->
      <div class="jcrop-hline"></div>
      <div class="jcrop-hline bottom"></div>
      <div class="jcrop-vline right"></div>
      <div class="jcrop-vline"></div>
      <div
        class="jcrop-tracker jcrop-selection-tracker"
        (mousedown)="onSelectionTrackerMouseDown($event)"
        (touchstart)="onSelectionTrackerTouchStart($event)"
      ></div>
      <img
        alt=""
        class="jcrop-preview"
        [src]="src()"
        [style.height.px]="displayHeight()"
        [style.width.px]="displayWidth()"
        [style.left.px]="img2Left()"
        [style.top.px]="img2Top()"
      />
    </div>
    <div class="jcrop-handles-holder" [style.display]="handlesVisible() ? '' : 'none'">
      <!-- cursor/opacity/position/class are static (jcrop.component.scss); z-index is inline (via
           dragbars/handles, jcrop.component.ts) since it's the one thing genuinely unique per
           element, not shareable via a class. Each still forwards mousedown/touchstart into
           #createDragger() (jcrop.component.ts) via onDragMouseDown/onDragTouchStart, passing its
           own fixed ordinal - fixed in number and identity now, but still real drag targets,
           unlike the borders above. -->
      @for (dragbar of dragbars; track dragbar.ord) {
        <div
          class="jcrop-dragbar ord-{{ dragbar.ord }}"
          [style.z-index]="dragbar.zIndex"
          (mousedown)="onDragMouseDown(dragbar.ord, $event)"
          (touchstart)="onDragTouchStart(dragbar.ord, $event)"
        ></div>
      }
      @for (handle of handles; track handle.ord) {
        <div
          class="jcrop-handle ord-{{ handle.ord }}"
          [style.z-index]="handle.zIndex"
          (mousedown)="onDragMouseDown(handle.ord, $event)"
          (touchstart)="onDragTouchStart(handle.ord, $event)"
        ></div>
      }
    </div>
  </div>
  <div
    class="jcrop-tracker"
    [style.cursor]="trackerCursor()"
    [style.z-index]="trackerZIndex()"
    [style.height.px]="trackerHeight()"
    [style.width.px]="trackerWidth()"
    [style.left.px]="trackerOffset"
    [style.top.px]="trackerOffset"
    (mousedown)="onTrackerMouseDown($event)"
    (touchstart)="onTrackerTouchStart($event)"
  ></div>
  <img
    #workingImg
    alt=""
    class="jcrop-working-image"
    [src]="src()"
    [style.opacity]="imgOpacity()"
    [style.height.px]="displayHeight()"
    [style.width.px]="displayWidth()"
  />
</div>
