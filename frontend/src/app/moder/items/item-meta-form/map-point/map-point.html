<input
  #latitude
  type="text"
  placeholder="Latitude"
  i18n-placeholder
  class="form-control"
  [formField]="coordinatesForm.lat"
  (input)="coordsChanged()"
  (blur)="markAsTouched()"
/>
<input
  type="text"
  placeholder="Longitude"
  i18n-placeholder
  class="form-control"
  [formField]="coordinatesForm.lng"
  (input)="coordsChanged()"
  (blur)="markAsTouched()"
/>
<div
  style="width: 100%; height: 300px"
  class="mb-4"
  leaflet
  [leafletCenter]="center"
  [leafletOptions]="mapOptions"
  [leafletLayers]="markers"
  (leafletMapReady)="onMapReady($event)"
></div>
