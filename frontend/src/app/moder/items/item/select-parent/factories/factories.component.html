@if (factoriesResource.error(); as error) {
  <p class="alert alert-danger" role="alert">{{ errorMessage(error) }}</p>
} @else if (factoriesResource.isLoading()) {
  <div class="spinner-border" role="status"><span class="visually-hidden" i18n>Loading…</span></div>
} @else if (factoriesResource.value(); as response) {
  <div class="card card-body">
    <ul>
      @for (item of response.items; track item.id) {
        <li class="car-node">
          <app-moder-items-item-select-parent-tree-item
            [item]="item"
            [order]="ItemParentsRequest.Order.AUTO"
            [disableItemID]="(itemID$ | async) || ''"
            (selected)="onSelect($event)"
          />
        </li>
      }
    </ul>
    @if (response.paginator) {
      <app-paginator [data]="response.paginator" />
    }
  </div>
}
