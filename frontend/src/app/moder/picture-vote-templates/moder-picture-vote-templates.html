<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item">
      <a routerLink="/" i18n>Index page</a>
    </li>
    <li class="breadcrumb-item">
      <a routerLink="/moder" i18n>Moderator page</a>
    </li>
  </ol>
</nav>

<div class="page-header">
  <h1 i18n>Picture vote templates</h1>
</div>

<app-resource-status [resource]="templatesResource" [empty]="templates()?.length === 0" />
@for (template of templates(); track template.id) {
  <p>
    @if (template.vote > 0) {
      <i class="bi bi-hand-thumbs-up-fill text-success" aria-hidden="true"></i>
    }
    @if (template.vote < 0) {
      <i class="bi bi-hand-thumbs-down-fill text-danger" aria-hidden="true"></i>
    }
    <span class="mx-2">{{ template.message }}</span>
    <button type="button" class="btn btn-danger btn-sm" aria-label="Delete" (click)="deleteTemplate(template)">
      <span class="bi bi-x" aria-hidden="true"></span>
    </button>
  </p>
}

<form class="card card-body form-vertical" novalidate (submit)="$event.preventDefault(); createTemplate()">
  <h2 i18n>Add template</h2>

  <div class="mb-3">
    <label i18n for="name">Reason</label>
    <input type="text" id="name" class="form-control" [formField]="form.name" />
  </div>
  <div class="mb-3">
    <label i18n for="vote">Vote</label>
    <select id="vote" class="form-select" [formField]="form.vote">
      <option value="-1" class="text-danger" i18n>Negative</option>
      <option value="1" class="text-success" i18n>Positive</option>
    </select>
  </div>
  <button type="submit" class="btn btn-primary" [disabled]="form().submitting() || form().invalid()">
    <ng-container i18n>Submit</ng-container>
  </button>
</form>
