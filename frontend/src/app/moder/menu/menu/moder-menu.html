@if (items(); as items) {
  <div class="moderator-menu-container">
    <div class="btn-group" ngbDropdown placement="top-right">
      <button type="button" ngbDropdownToggle class="btn btn-secondary">
        <ng-container i18n>Moderator menu</ng-container>
        <span class="caret" aria-hidden="true"></span>
      </button>
      <div class="dropdown-menu-right" ngbDropdownMenu>
        @for (item of items; track item) {
          <a class="dropdown-item" [routerLink]="item.routerLink" [queryParams]="item.queryParams">
            @if (item.icon) {
              <i aria-hidden="true" [class]="item.icon"></i>
            }
            {{ item.label }}
            @if (item.countResource?.hasValue() && item.countResource.value(); as count) {
              <span [class]="'badge rounded-pill ' + (item.badgeClass ?? 'text-bg-secondary')">{{ count }}</span>
            }
          </a>
          @if (item.countResource; as resource) {
            @if (resource.error()) {
              <app-resource-status [resource]="resource" />
            }
          }
        }
        <div class="dropdown-divider"></div>
        <a routerLink="/moder" class="dropdown-item">
          <i class="bi bi-gear-fill me-1" aria-hidden="true"></i>
          <ng-container i18n>Moderator page</ng-container>
        </a>
      </div>
    </div>
  </div>
}
