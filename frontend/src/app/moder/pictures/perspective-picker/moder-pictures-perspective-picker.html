<select class="form-select" style="max-width: 10em" [formField]="select" (change)="change()">
  <option [value]="0">--</option>
  @for (perspective of perspectives$ | async; track perspective.id) {
    <option [value]="perspective.id">
      {{ getPerspectiveTranslation(perspective.name) }}
    </option>
  }
</select>
