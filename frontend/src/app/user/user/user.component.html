@if (user(); as user) {
  <span class="user" [class.muted]="user.deleted" [class.long-away]="user.longAway" [class.green-man]="user.green">
    <!-- prettier-ignore -->
    <i class="bi bi-person-fill" aria-hidden="true"></i>&ngsp;
    @if (user.deleted) {
      <span i18n>deleted user</span>
    } @else {
      <a [routerLink]="['/users', user.identity ? user.identity : 'user' + user.id]">{{ user.name }}</a>
    }
  </span>
}
