user  nginx;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
}

http {
	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;
	types_hash_max_size 2048;
	server_tokens off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	access_log /dev/stdout;
	error_log /dev/stderr info;

	# /ws/ carries a Keycloak access token as a query param (browsers can't set custom
	# WebSocket handshake headers), so it must not be logged with the default $request
	# format, which includes the full query string.
	log_format ws_no_token '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

	gzip on;

	http2_recv_buffer_size 10m;

	map $http_upgrade $connection_upgrade {
	  default upgrade;
	  ''      close;
	}

	server {
    listen      80;
    listen      [::]:80;

    return 301 https://en.localhost$request_uri;
  }

  server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    server_name localhost default_server;
    http2  on;

    ssl_certificate /localhost.crt;
    ssl_certificate_key /localhost.key;

    return 301 https://en.localhost$request_uri;
  }

  server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    server_name grpc.localhost;
    http2  on;

    ssl_certificate /localhost.crt;
    ssl_certificate_key /localhost.key;

    large_client_header_buffers 8 10m;
    http2_chunk_size  10m;

    location / {
      grpc_pass grpc://goautowp-serve:8080;
      grpc_set_header Host              $host;
      grpc_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      grpc_set_header X-Forwarded-Proto $scheme;
      grpc_set_header X-Real-IP         $remote_addr;
    }
  }

#  server {
#    listen      443 ssl;
#    listen      [::]:443 ssl;
#    server_name ru.localhost;

#    location = / {
#      proxy_pass http://frontend:8080/ru;
#    }

#    location / {
#      proxy_pass http://frontend:8080/ru/;
#    }
#  }

  server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    server_name ru.localhost en.localhost fr.localhost zh.localhost be.localhost br.localhost uk.localhost es.localhost it.localhost he.localhost en.wheelsage.org;
    http2  on;

    ssl_certificate /localhost.crt;
    ssl_certificate_key /localhost.key;

    server_tokens off;

    gzip_static  on;

    gzip            on;
    gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript;

    client_max_body_size 100m;

    # Port 8081, not 4000: pages go to the nginx sidecar in the goautowp-serve pod, which serves
    # the built frontend bundle off disk and passes only non-file requests through to the SSR
    # server on 4000. Mirrors the `/` rule in chart/templates/routes.yaml.
    location / {
      proxy_pass http://goautowp-serve:4000;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header Host              $host;
    }

    location /goautowp. {
      proxy_pass http://goautowp-serve:8080;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_connect_timeout  600s;
      proxy_send_timeout  600s;
      proxy_read_timeout  600s;
    }

    location /api/ {
      proxy_pass http://goautowp-serve:8080;
      proxy_set_header Host              $host;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
      access_log /dev/stdout ws_no_token;

      proxy_pass http://goautowp-serve:8080;
      proxy_http_version 1.1;
      proxy_set_header Upgrade          $http_upgrade;
      proxy_set_header Connection       $connection_upgrade;
      proxy_set_header Host             $host;
      proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }
  }
}
